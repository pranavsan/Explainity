kind = "web"
previewPath = "/"
title = "CodeExplainer"
version = "1.0.0"
id = "artifacts/codeexplainer"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24608

[services.development]
run = "pnpm --filter @workspace/codeexplainer run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/codeexplainer", "run", "build" ]
publicDir = "artifacts/codeexplainer/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24608"
BASE_PATH = "/"
